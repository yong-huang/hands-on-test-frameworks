<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>内层</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="framebox" style="border-color:#e0a800;">内层：确认购买
  <button id="buy-btn" class="primary">确认购买</button>
  <button id="pay-btn" class="ghost" disabled>立即支付</button>
  <span id="order-id">订单号：（未生成）</span>
</div>
<script>
document.getElementById("buy-btn").addEventListener("click", async () => {
  const r = await fetch("/api/orders", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ customer: "iframe-user", product: "靶场测试商品", qty: 1 })
  });
  const order = await r.json();
  document.getElementById("order-id").textContent = "订单号 " + order.id;
  document.getElementById("pay-btn").disabled = false;
});
document.getElementById("pay-btn").addEventListener("click", async () => {
  const oid = document.getElementById("order-id").textContent.replace("订单号 ", "").trim();
  const r = await fetch(`/api/orders/${oid}/pay`, { method: "POST" });
  const order = await r.json();
  document.getElementById("order-id").textContent = `订单号 ${order.id}（已支付 $${order.amount}）`;
});
</script>
</body>
</html>
