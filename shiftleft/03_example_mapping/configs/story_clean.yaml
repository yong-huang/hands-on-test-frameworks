# Example Mapping 工作台输入：三色卡片 —— 规则（蓝）/ 例子（绿）/ 疑问（红）。
# 本条是"干净"样例：3 条规则、共 6 个例子、2 个未决问题，生成的 feature 应零错误。
story:
  id: US-201
  title: 订单满减
  goal: 满 100 减 20，且不产生负数应付

rules:  # 蓝卡：业务规则（一条规则 → 一个场景大纲）
  - id: R1
    text: 小计满 100 元才可用满减
    examples:  # 绿卡：具体例子（每条规则内的例子共用同一组列名）
      - 小计: "150.00"
        动作: 提交满减
        预期: 应付 130.00
      - 小计: "100.00"
        动作: 提交满减
        预期: 应付 80.00（恰在门槛可用）
      - 小计: "99.99"
        动作: 提交满减
        预期: 拒绝用券，应付 99.99

  - id: R2
    text: 每单限用一张满减券
    examples:
      - 前置: 订单已用一张满减券
        动作: 再选一张券提交
        预期: 提示 COUPON_LIMIT，仅一张生效
      - 前置: 新订单
        动作: 连选两张券提交
        预期: 提示 COUPON_LIMIT，仅一张生效

  - id: R3
    text: 退货后小计低于门槛则满减取消
    examples:
      - 前置: 满减订单退货一件商品
        动作: 重算小计
        预期: 小计低于 100 时应付恢复原价

questions:  # 红卡：未决问题（owner 未定时留"待定"，进评审会认领）
  - q: 满 100 按下单时点还是支付时点计算？
    owner: 待定
    status: open
  - q: 满减券与积分能否叠加？
    owner: 待定
    status: open
