# 需求：新人立减券（关卡 1 需求评审的输入之一）
# 每条验收条件（AC = Acceptance Criteria）都有唯一 ID，供追溯映射。
story: US-101 新人立减优惠券
acceptance_criteria:
  - id: AC-1
    text: 订单小计未满 ¥100 时提交用券请求，必须被拒绝且订单金额不减
  - id: AC-2
    text: 所有金额（小计、应付）精确到分；实现禁止使用二进制浮点（float），
      应使用十进制精确类型（如 Decimal）
  - id: AC-3
    text: 满 ¥100 用券后，应付金额 = 小计 − 券面额 ¥20
