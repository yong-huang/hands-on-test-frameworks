# 可测性规则与权重（规则即配置：改这里即可迁移到团队自己的口径）
#
# 评分模型（每个数字都可复算）：
#   score = 100 − Σ 扣分，下限 0；另有两道封顶：
#   - 验收条件为 0 条 → score 封顶 40（没有可断言的东西，直接判不可测）
#   - 验收条件 > max_acs 条 → score 封顶 55（超出单故事容量，先拆分再谈测试）
#
# 分档：≥80 良好可直接开发；60-79 需修订；<60 不可测，打回重写。
thresholds:
  good: 80          # ≥80 良好
  reject: 60        # <60 不可测
  max_acs: 7        # 单故事验收条件上限，超出判"过大"并封顶

deductions:
  vague_word: 15        # 每命中一个歧义词
  no_observable: 10     # 每条验收条件无可观察预期值（不含数字）
  no_automation: 10     # 每条验收条件无可自动化线索（不提接口/字段/输入输出）
  dependency: 10        # 每处故事间/条件间依赖词
  connector: 5          # 每处多行为连接词（一条 AC 塞多个行为）
  too_many: 20          # 验收条件超上限（另叠加封顶 55：先拆分再谈测试）
  empty_acs: 60         # 验收条件为 0 条（另叠加封顶 40：无可断言即不可测）

# 歧义词表：需求里出现即扣分——每个词都对应一类"没法写断言"的说法
vague_words:
  [快速, 合理, 稳定, 友好, 简单, 尽量, 适当, 优化, 满意, 良好, 正确, 相关, 一些, 方便, 高效]

# 可自动化线索：出现任一词视为"告诉了测试怎么调它"
automation_hints:
  [调用, 接口, API, 返回, 请求, 响应, 字段, 参数, 输入, 输出, 状态码, JSON, 数据库, SQL]

# 依赖词：验收条件的成立以别的东西为先
dependency_words: [之后, 完成后, 依赖, 前提, 等待]

# 连接词：一条验收条件里塞了多个行为，建议拆开
connector_words: [同时, 并且, 以及, 另外]
