global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # 容器网络内用服务名寻址，端口是容器内端口
  - job_name: shop
    static_configs:
      - targets: ["shop:8931"]
  - job_name: shorturl
    static_configs:
      - targets: ["shorturl:8932"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
