# 钉住 compose 项目名：目录从 labs/ 迁到 performance/ 后，
# 容器/网络名保持 31_perf_baseline-* 不变，跨 lab 引用不破
name: 31_perf_baseline

services:
  postgres:
    image: postgres:16-alpine
    # pg_stat_statements：项目 6 的慢 SQL 排行榜需要 shared_preload
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "15432:5432"   # 剖析实验（lab 34）从宿主机连库用
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 不能只 pg_isready——init 脚本没跑完时 TCP 已就绪。
      # 种子查询通过 = schema + 5000 条短链全部就位，下游才允许启动
      # 只验证种子下限（压测会写入新短链，count 会涨，不能 grep 精确值）
      test: ["CMD-SHELL", "psql -U shop -d shorturl -tAc 'SELECT count(*) >= 5000 FROM links' | grep -q t"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    # 当前无服务消费 Redis——它是项目 7（缓存）的弹药，先入库待命

  shop:
    build: ./shop
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}   # 项目 6 的调参旋钮（默认 10）
      CACHE_MODE: ${CACHE_MODE:-off}        # 项目 7：off | on | hardened
      CACHE_TTL: ${CACHE_TTL:-60}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}   # 项目 8：worker×并发矩阵
      REDIS_URL: redis://redis:6379/0
    ports:
      - "19331:8931"   # 宿主侧用高位端口：本机 893x 已被 OrbStack 占用
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  shorturl:
    build: ./shorturl
    environment:
      DATABASE_URL: postgres://shorturl:shorturl@postgres:5432/shorturl
      GOMAXPROCS: ${GOMAXPROCS:-0}             # 项目 8：0=默认全部核
      LEAK_MODE: ${LEAK_MODE:-off}             # 项目 9：泄漏注入 off|heap|goroutine
    ports:
      - "19332:8932"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
