# dev：宽松快速，允许调试开关
database: { url: "sqlite:///dev.db", pool_size: 2, timeout_s: 5 }
redis: { url: "redis://127.0.0.1:6379/0", timeout_ms: 100 }
api: { base_url: "http://127.0.0.1:8899", rate_limit_rps: 1000 }
logging: { level: DEBUG }
features: { new_checkout: true, dark_mode: false }
retry: { max_attempts: 3, backoff_ms: 200 }
