<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>下单页</title></head>
<body><h1>订单提交</h1>
<form class="order-form" id="orderForm">
  <label for="customer">客户名</label>
  <input type="text" id="customer" name="customer" class="input-field" placeholder="客户名" aria-label="客户名">
  <label for="item">商品</label>
  <input type="text" id="item" name="item" class="input-field" placeholder="商品" aria-label="商品">
  <button type="submit" id="submitBtn" class="btn-primary">提交订单</button>
</form></body></html>
