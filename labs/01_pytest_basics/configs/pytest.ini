# lab 01 的 pytest 配置——演示"配置文件如何改变运行行为"
# 用法：pytest -c configs/pytest.ini（在 lab 目录下执行）
[pytest]
# 只从 tests/ 收集用例，避免把 temperature.py 里的 Test 开头类误当测试
testpaths = tests
# 命令行默认附加参数：显示每条用例的运行进度
addopts = -v
# 自定义 marker 注册（未注册的 marker 会有 warning，好习惯是先声明）
markers =
    slow: 运行超过 1s 的用例（本实验暂未使用，lab 09 会大量用到）
